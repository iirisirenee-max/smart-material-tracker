<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Material Tracker</title>
    <style>
        /* Base Reset & Layout Layout */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #1e293b; color: white; padding: 30px; }
        .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 25px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        
        /* Header Title App Banner */
        header { grid-column: span 2; background: #0f172a; padding: 25px; border-radius: 8px; margin-bottom: 10px; border-left: 6px solid #38bdf8; }
        @media (max-width: 768px) { header { grid-column: span 1; } }
        header h1 { font-size: 26px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        header p { font-size: 14px; color: #94a3b8; margin-top: 5px; }

        /* Panel Containers */
        .panel { background: #334155; padding: 25px; border-radius: 8px; height: fit-content; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .panel h3 { font-size: 18px; margin-bottom: 15px; border-bottom: 2px solid #475569; padding-bottom: 8px; color: #f8fafc; }
        
        /* Interactive Input Form Control */
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 13px; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 12px; margin-top: 6px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: white; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        button { width: 100%; background: #38bdf8; color: #0f172a; font-weight: bold; padding: 12px; border-radius: 6px; border: none; font-size: 15px; cursor: pointer; transition: all 0.2s ease; margin-top: 25px; }
        button:hover { background: #0ea5e9; color: white; transform: translateY(-1px); }
        button:active { transform: translateY(1px); }

        /* Structural Ledger Output Grid View */
        .table-responsive { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background: #0f172a; padding: 14px; font-weight: 600; color: #94a3b8; text-transform: uppercase; font-size: 12px; }
        td { padding: 14px; border-bottom: 1px solid #475569; color: #e2e8f0; }
        tr:hover { background: rgba(255,255,255,0.02); }
        
        /* Low Stock Utility Alerts */
        .alert-row { background-color: rgba(239, 68, 68, 0.15) !important; }
        .alert-row td { color: #fca5a5; }
        .badge { display: inline-block; padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 4px; text-transform: uppercase; }
        .badge.success { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
        .badge.danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    </style>
    <!-- Loading Supabase JS Library Engine via Cloud CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div class="container">
        <header>
            <h1>🏗️ Smart Construction Material Tracker</h1>
            <p>Live SQL Ledger Connected Directly to Cloud Database | Site Code: JRT-N26</p>
        </header>

        <!-- Input Interactive Management Panel -->
        <div class="panel">
            <h3>Log Material Invoice</h3>
            <form id="materialForm">
                <label>Material Classification</label>
                <select id="matName">
                    <option value="OPC Cement (Bags)">OPC Cement (Bags)</option>
                    <option value="TMT Steel Bars (Tonnes)">TMT Steel Bars (Tonnes)</option>
                    <option value="Fine River Sand (Cu.m)">Fine River Sand (Cu.m)</option>
                    <option value="Coarse Aggregate (Cu.m)">Coarse Aggregate (Cu.m)</option>
                </select>

                <label>Inward Quantity</label>
                <input type="number" id="matQty" value="50" min="1" required>

                <label>Unit Market Price (₹)</label>
                <input type="number" id="matPrice" value="450" min="1" required>

                <button type="submit">Save to Live Database</button>
            </form>
        </div>

        <!-- Inventory Database Grid Panel View -->
        <div class="panel">
            <h3>Active Site Ledger</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Material Classification</th>
                            <th>Stock Qty</th>
                            <th>Avg Price</th>
                            <th>Total Cost</th>
                            <th>Status Condition</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryRows">
                        <!-- Database rows will inject here automatically -->
                        <tr>
                            <td colspan="5" style="text-align: center; color: #94a3b8; padding: 30px;">
                                Connecting to live data engine...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
